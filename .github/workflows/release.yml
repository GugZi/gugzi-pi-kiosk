name: Validate and publish kiosk update

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: kiosk-release-main
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Python setup
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate source
        run: |
          python -m compileall -q gugzi_kiosk setup.py
          python -m pip install pytest
          python -m pytest -q tests
          bash -n install.sh
          bash -n gugzi-kiosk
          bash -n scripts/cursor-cec.sh
      - name: Package tested version
        if: github.event_name != 'pull_request'
        id: package
        shell: bash
        run: |
          set -euo pipefail
          VERSION="1.${GITHUB_RUN_NUMBER}.0"
          TAG="v${VERSION}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          mkdir -p dist/gugzi-pi-kiosk
          cp -a gugzi_kiosk scripts examples systemd requirements.txt setup.py install.sh gugzi-kiosk README.md CHANGELOG.md .gitignore dist/gugzi-pi-kiosk/
          echo "$VERSION" > dist/gugzi-pi-kiosk/VERSION
          (cd dist && zip -qr gugzi-pi-kiosk.zip gugzi-pi-kiosk -x '*/__pycache__/*' '*.pyc')
          (cd dist && sha256sum gugzi-pi-kiosk.zip > gugzi-pi-kiosk.zip.sha256)
      - name: Build release notes from changelog and commits
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          {
            printf '## Changelog\\n\\n'
            cat CHANGELOG.md
            printf '\\n## Changes since previous release\\n\\n'
            previous_tag="$(git tag --sort=-version:refname --list 'v[0-9]*' | head -n 1)"
            if [[ -n "$previous_tag" ]]; then
              git log "$previous_tag..HEAD" --no-merges --pretty='- %s (%h)' || true
            else
              git log -n 30 --no-merges --pretty='- %s (%h)'
            fi
            printf '\\n## Source\\n\\nCommit: \`%s\`\\n' "$GITHUB_SHA"
          } > dist/release-notes.md
      - name: Publish GitHub release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.package.outputs.tag }}
        run: |
          gh release create "$TAG" \
            dist/gugzi-pi-kiosk.zip \
            dist/gugzi-pi-kiosk.zip.sha256 \
            --title "GugZi Pi Kiosk $TAG" \
            --notes-file dist/release-notes.md \
            --latest
